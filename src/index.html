<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>JSX Renderer</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- ── Titlebar ─────────────────────────────────────────────────────── -->
    <div class="titlebar">
      <div class="titlebar-drag-region"></div>
      <div class="titlebar-center">
        <span class="titlebar-icon">⚛</span>
        <span class="titlebar-title" id="titlebarTitle">JSX Renderer</span>
      </div>
      <div class="titlebar-actions">
        <button class="btn-icon" id="btnOpenFile" title="Open File (⌘O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnExportPDF" title="Export PDF (⌘⇧E)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="12" y1="18" x2="12" y2="12"/>
            <polyline points="9 15 12 18 15 15"/>
          </svg>
        </button>
        <button class="btn-icon" id="btnExportPPT" title="Export PPT (⌘⇧P)" disabled style="margin-left:4px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <path d="M8 12h8"/>
            <path d="M8 16h8"/>
            <path d="M8 8h2"/>
          </svg>
        </button>
        <div class="divider-v"></div>
        <button class="btn-icon" id="btnToggleSidebar" title="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Main Layout ──────────────────────────────────────────────────── -->
    <div class="app-layout">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-label">FILES</span>
          <button class="btn-icon-sm" id="btnAddFile" title="Open file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="file-list" id="fileList">
          <!-- Empty state -->
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📂</div>
            <p>Drop .jsx files here<br/>or click <strong>+</strong> to open</p>
          </div>
        </div>
      </aside>

      <!-- Resize handle -->
      <div class="resize-handle" id="resizeHandle"></div>

      <!-- Main content -->
      <main class="content-area">
        <!-- Toolbar -->
        <div class="toolbar" id="toolbar">
          <div class="toolbar-left">
            <span class="file-badge" id="currentFileName">No file open</span>
            <span class="hot-reload-badge" id="hotReloadBadge">
              <span class="pulse"></span>
              Live
            </span>
          </div>
          <div class="toolbar-right">
            <div class="zoom-controls">
              <button class="btn-sm" id="btnZoomOut" title="Zoom out">−</button>
              <span class="zoom-level" id="zoomLevel">100%</span>
              <button class="btn-sm" id="btnZoomIn" title="Zoom in">+</button>
              <button class="btn-sm" id="btnZoomReset" title="Reset zoom">↺</button>
            </div>
            <div class="divider-v"></div>
            <select class="select-sm" id="bgSelect" title="Preview background">
              <option value="dark">Dark BG</option>
              <option value="light">Light BG</option>
              <option value="transparent">Transparent</option>
            </select>
            <div class="divider-v"></div>
            <button class="btn-primary" id="btnExportPPTToolbar" disabled style="margin-right: 8px;">
              ↓ Export PPT
            </button>
            <button class="btn-primary" id="btnExportPDFToolbar" disabled>
              ↓ Export PDF
            </button>
          </div>
        </div>

        <!-- Preview area -->
        <div class="preview-wrapper" id="previewWrapper">
          <!-- Drop zone overlay -->
          <div class="drop-zone" id="dropZone">
            <div class="drop-zone-content">
              <div class="drop-icon">⚛</div>
              <h2>Drop a .jsx file to preview</h2>
              <p>or <button class="link-btn" id="dropOpenBtn">click to open a file</button></p>
              <div class="supported-formats">Supports .jsx · .js · .tsx · .ts</div>
            </div>
          </div>

          <!-- Webview for rendering JSX -->
          <webview
            id="previewWebview"
            src="preview.html"
            style="display:none; width:100%; height:100%;"
            disablewebsecurity
            webpreferences="contextIsolation=no, nodeIntegration=no, allowRunningInsecureContent=yes"
          ></webview>
        </div>

        <!-- Status bar -->
        <div class="status-bar">
          <span class="status-msg" id="statusMsg">Ready</span>
          <span class="status-right">
            <span id="statusFileInfo"></span>
          </span>
        </div>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
